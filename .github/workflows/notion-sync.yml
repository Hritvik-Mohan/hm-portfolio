name: Notion Sync

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pushes via a deploy key: the ruleset on main lets deploy keys bypass
      # the required "lint-and-build" check, which GITHUB_TOKEN can't.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.NOTES_SYNC_DEPLOY_KEY }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync notes from Notion
        run: node scripts/sync-notion.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit changes
        run: |
          git add notes
          if git diff --cached --quiet; then
            echo "No note changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "notes: sync from Notion"
          git push
